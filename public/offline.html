<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#171717" />
        <title>Sin conexi&oacute;n - BarberCore</title>

        <style>
            :root {
                --gold: #c9a227;
                --gold-dark: #8b6a12;
                --ink: #1c1c1c;
                --paper: #faf8f2;
                --white: #ffffff;
                --muted: #68645d;
                --border: #e5e0d6;
            }

            * { box-sizing: border-box; }

            body {
                margin: 0;
                min-width: 320px;
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 28px;
                background: var(--paper);
                color: var(--ink);
                font-family: Arial, Helvetica, sans-serif;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0 auto 0 0;
                width: 9px;
                background: var(--gold);
            }

            .offline-layout {
                width: min(100%, 880px);
                min-height: 500px;
                display: grid;
                grid-template-columns: minmax(280px, 0.78fr) minmax(360px, 1.22fr);
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: var(--white);
                box-shadow: 0 28px 72px rgba(28, 28, 28, 0.13);
            }

            .brand-panel {
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
                padding: 34px;
                background: #171717;
                color: var(--white);
            }

            .brand-panel::after {
                content: "";
                position: absolute;
                right: -48px;
                bottom: 82px;
                width: 150px;
                height: 150px;
                border: 34px solid rgba(201, 162, 39, 0.12);
                border-radius: 50%;
            }

            .brand {
                position: relative;
                z-index: 1;
                display: flex;
                align-items: center;
                gap: 13px;
            }

            .brand img {
                width: 50px;
                height: 50px;
                padding: 4px;
                border-radius: 8px;
                background: var(--white);
                object-fit: contain;
            }

            .brand strong {
                display: block;
                font-size: 20px;
            }

            .brand span {
                display: block;
                margin-top: 3px;
                color: rgba(255, 255, 255, 0.55);
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 1.3px;
                text-transform: uppercase;
            }

            .brand-symbol {
                position: relative;
                z-index: 1;
                width: 112px;
                height: 112px;
                display: grid;
                place-items: center;
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 50%;
                color: var(--gold);
            }

            .brand-symbol svg {
                width: 48px;
                height: 48px;
            }

            .brand-foot {
                position: relative;
                z-index: 1;
                display: flex;
                align-items: center;
                gap: 8px;
                color: rgba(255, 255, 255, 0.48);
                font-size: 11px;
            }

            .brand-foot svg {
                width: 15px;
                height: 15px;
                color: var(--gold);
            }

            .content-panel {
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 54px 58px;
            }

            .connection-icon {
                width: 58px;
                height: 58px;
                display: grid;
                place-items: center;
                margin-bottom: 26px;
                border: 1px solid rgba(201, 162, 39, 0.32);
                border-radius: 8px;
                background: #fffaf0;
                color: var(--gold-dark);
            }

            .connection-icon svg {
                width: 29px;
                height: 29px;
            }

            svg {
                fill: none;
                stroke: currentColor;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-width: 1.8;
            }

            .eyebrow {
                margin-bottom: 9px;
                color: var(--gold-dark);
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 1.5px;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                font-size: 38px;
                line-height: 1.08;
            }

            .message {
                max-width: 430px;
                margin: 15px 0 25px;
                color: var(--muted);
                font-size: 15px;
                line-height: 1.65;
            }

            .connection-hint {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 30px;
                color: #4d4943;
                font-size: 13px;
                font-weight: 700;
            }

            .connection-hint svg {
                width: 18px;
                height: 18px;
                flex: 0 0 18px;
                color: var(--gold-dark);
            }

            button {
                width: fit-content;
                min-height: 52px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 0 21px;
                border: 0;
                border-radius: 8px;
                background: var(--ink);
                color: var(--white);
                font: inherit;
                font-size: 14px;
                font-weight: 800;
                cursor: pointer;
                box-shadow: 0 12px 24px rgba(28, 28, 28, 0.17);
                transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
            }

            button svg {
                width: 18px;
                height: 18px;
                color: var(--gold);
                stroke-width: 2;
            }

            button:hover {
                transform: translateY(-2px);
                background: #303030;
                box-shadow: 0 16px 30px rgba(28, 28, 28, 0.22);
            }

            button:focus-visible {
                outline: 3px solid rgba(201, 162, 39, 0.35);
                outline-offset: 3px;
            }

            @media (max-width: 720px) {
                body { padding: 18px; }
                .offline-layout {
                    width: calc(100vw - 36px);
                    min-height: 0;
                    grid-template-columns: 1fr;
                }
                .brand-panel {
                    min-height: 92px;
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    padding: 18px 22px;
                }
                .brand-symbol, .brand-foot, .brand-panel::after { display: none; }
                .content-panel { padding: 38px 34px 42px; }
                h1 { font-size: 33px; }
            }

            @media (max-width: 440px) {
                body { padding: 12px; }
                body::before { width: 5px; }
                .offline-layout { width: calc(100vw - 24px); }
                .brand-panel { padding: 15px 18px; }
                .brand img { width: 44px; height: 44px; }
                .content-panel { padding: 30px 24px 32px; }
                .connection-icon { margin-bottom: 22px; }
                h1 { font-size: 29px; }
                .message { margin-bottom: 21px; }
                button { width: 100%; }
            }

            @media (prefers-reduced-motion: reduce) {
                button { transition: none; }
            }
        </style>
    </head>
    <body>
        <main class="offline-layout">
            <aside class="brand-panel" aria-label="BarberCore">
                <div class="brand">
                    <img src="/icons/icon-192.png?v=2" alt="" />
                    <div>
                        <strong>BarberCore</strong>
                        <span>Gesti&oacute;n para barber&iacute;as</span>
                    </div>
                </div>

                <div class="brand-symbol" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <circle cx="6" cy="7" r="3" />
                        <path d="M8.7 8.4 19 14.5" />
                        <path d="m8.7 15.6 10.3-6.1" />
                        <circle cx="6" cy="17" r="3" />
                    </svg>
                </div>

                <div class="brand-foot">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                    Tu sesi&oacute;n permanece protegida
                </div>
            </aside>

            <section class="content-panel" aria-labelledby="offline-title">
                <div class="connection-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 20h.01" />
                        <path d="M8.5 16.4a5 5 0 0 1 7 0" />
                        <path d="M5 12.9a10 10 0 0 1 5.2-2.7" />
                        <path d="M19 12.9a10 10 0 0 0-2-1.5" />
                        <path d="M2 8.8a15 15 0 0 1 4.2-2.6" />
                        <path d="M22 8.8A15 15 0 0 0 10.7 5" />
                        <path d="m2 2 20 20" />
                    </svg>
                </div>

                <span class="eyebrow">Conexi&oacute;n interrumpida</span>
                <h1 id="offline-title">Volvamos a conectarte</h1>
                <p class="message">
                    No pudimos comunicarnos con BarberCore. Cuando recuperes
                    internet, podr&aacute;s continuar desde donde estabas.
                </p>

                <div class="connection-hint">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 20h.01" />
                        <path d="M7 20v-4" />
                        <path d="M12 20v-8" />
                        <path d="M17 20V8" />
                        <path d="M22 4v16" />
                    </svg>
                    Revisa tu Wi-Fi o tus datos m&oacute;viles
                </div>

                <button type="button" onclick="window.location.reload()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16" />
                        <path d="M3 21v-5h5" />
                        <path d="M3 12A9 9 0 0 1 18.3 5.6L21 8" />
                        <path d="M21 3v5h-5" />
                    </svg>
                    Intentar de nuevo
                </button>
            </section>
        </main>
    </body>
</html>
