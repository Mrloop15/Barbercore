<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1c1c1c" />
        <title>Sin conexi&oacute;n - BarberCore</title>

        <style>
            :root {
                --gold: #c9a227;
                --gold-dark: #927015;
                --ink: #1c1c1c;
                --paper: #faf8f2;
                --white: #ffffff;
                --muted: #6b6b6b;
                --border: #e5e0d6;
            }

            * { box-sizing: border-box; }

            body {
                margin: 0;
                min-width: 320px;
                min-height: 100vh;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                padding: 24px;
                background:
                    linear-gradient(rgba(201, 162, 39, 0.055) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(201, 162, 39, 0.055) 1px, transparent 1px),
                    var(--paper);
                background-size: 38px 38px;
                color: var(--ink);
                font-family: Arial, Helvetica, sans-serif;
            }

            .offline-shell {
                width: min(100%, 560px);
                overflow: hidden;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.96);
                box-shadow: 0 24px 64px rgba(28, 28, 28, 0.12);
            }

            .brand-bar {
                min-height: 78px;
                display: flex;
                align-items: center;
                gap: 13px;
                padding: 14px 20px;
                background: var(--ink);
                color: var(--white);
            }

            .brand-bar img {
                width: 48px;
                height: 48px;
                padding: 4px;
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-radius: 8px;
                background: var(--white);
                object-fit: contain;
            }

            .brand-copy strong {
                display: block;
                font-size: 19px;
            }

            .brand-copy span {
                display: block;
                margin-top: 3px;
                color: rgba(255, 255, 255, 0.58);
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 1.4px;
                text-transform: uppercase;
            }

            .offline-content {
                padding: 38px 42px 42px;
                text-align: left;
            }

            .status-mark {
                width: 52px;
                height: 52px;
                display: grid;
                place-items: center;
                margin-bottom: 24px;
                border: 1px solid rgba(201, 162, 39, 0.3);
                border-radius: 50%;
                background: rgba(201, 162, 39, 0.1);
                color: var(--gold-dark);
            }

            .status-mark svg {
                width: 25px;
                height: 25px;
                fill: none;
                stroke: currentColor;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-width: 1.8;
            }

            .eyebrow {
                display: block;
                margin-bottom: 9px;
                color: var(--gold-dark);
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 1.6px;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                font-size: 34px;
                line-height: 1.12;
            }

            p {
                max-width: 430px;
                margin: 14px 0 28px;
                color: var(--muted);
                font-size: 15px;
                line-height: 1.65;
            }

            button {
                min-height: 50px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 0 20px;
                border: 0;
                border-radius: 8px;
                background: var(--ink);
                color: var(--white);
                font: inherit;
                font-size: 14px;
                font-weight: 800;
                cursor: pointer;
                box-shadow: 0 12px 24px rgba(28, 28, 28, 0.16);
                transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
            }

            button:hover {
                transform: translateY(-2px);
                background: #2b2b2b;
                box-shadow: 0 16px 28px rgba(28, 28, 28, 0.2);
            }

            button:focus-visible {
                outline: 3px solid rgba(201, 162, 39, 0.35);
                outline-offset: 3px;
            }

            button svg {
                width: 17px;
                height: 17px;
                fill: none;
                stroke: var(--gold);
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-width: 2;
            }

            @media (max-width: 520px) {
                body { padding: 14px; }
                .offline-shell { width: calc(100vw - 28px); }
                .brand-bar { padding: 13px 16px; }
                .brand-bar img { width: 44px; height: 44px; }
                .offline-content { padding: 30px 24px 32px; }
                h1 { font-size: 29px; }
                button { width: 100%; }
            }

            @media (prefers-reduced-motion: reduce) {
                button { transition: none; }
            }
        </style>
    </head>
    <body>
        <main class="offline-shell">
            <header class="brand-bar">
                <img src="/icons/icon-192.png" alt="" />
                <div class="brand-copy">
                    <strong>BarberCore</strong>
                    <span>Gesti&oacute;n para barber&iacute;as</span>
                </div>
            </header>

            <section class="offline-content" aria-labelledby="offline-title">
                <div class="status-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 20h.01" />
                        <path d="M8.5 16.4a5 5 0 0 1 5.8-.6" />
                        <path d="M5 12.8a10 10 0 0 1 4.1-2.3" />
                        <path d="M19 8.8A15 15 0 0 0 5.7 6.6" />
                        <path d="m3 3 18 18" />
                    </svg>
                </div>
                <span class="eyebrow">Estado de conexi&oacute;n</span>
                <h1 id="offline-title">Est&aacute;s sin conexi&oacute;n</h1>
                <p>
                    BarberCore no puede conectarse en este momento. Revisa tu
                    conexi&oacute;n a internet y vuelve a intentarlo.
                </p>
                <button type="button" onclick="window.location.reload()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16" />
                        <path d="M3 21v-5h5" />
                        <path d="M3 12A9 9 0 0 1 18.3 5.6L21 8" />
                        <path d="M21 3v5h-5" />
                    </svg>
                    Reintentar conexi&oacute;n
                </button>
            </section>
        </main>
    </body>
</html>
